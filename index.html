<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>for Alice</title>
<style>
  :root{
    --paper:#fff7fb;
    --ink:#4b3741;
    --soft:#f8dfe9;
    --soft-2:#f3cfdc;
    --accent:#c47f99;
    --border:rgba(122, 76, 96, .12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:
      radial-gradient(circle at top left, rgba(255,255,255,.92), transparent 38%),
      radial-gradient(circle at bottom right, rgba(255,255,255,.55), transparent 30%),
      linear-gradient(135deg,#fdeff5,#f7dce7 55%, #f3d2e0);
    font-family: Georgia, 'Times New Roman', serif;
    color:var(--ink);
    padding:24px;
  }
  .wrap{width:min(92vw,720px);text-align:center}
  .intro{transition:.45s ease}
  .tiny{
    font-size:.8rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    opacity:.6;
    margin-bottom:18px
  }
  h1{font-size:clamp(2rem,7vw,4.4rem);font-weight:400;margin:0 0 14px}
  .sub{opacity:.72;margin:0 0 28px;font-size:1rem}
  button{
    border:1px solid var(--border);
    background:rgba(255,247,251,.92);
    color:var(--ink);
    padding:12px 20px;
    border-radius:999px;
    cursor:pointer;
    font:inherit;
    box-shadow:0 8px 24px rgba(105,73,88,.08);
    transition:.2s ease;
  }
  button:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(105,73,88,.12)}
  .card{
    display:none;
    margin-top:26px;
    background:var(--paper);
    border:1px solid rgba(196,127,153,.15);
    border-radius:22px;
    padding:clamp(24px,5vw,44px);
    text-align:left;
    box-shadow:0 24px 60px rgba(99,67,84,.14);
    transform:translateY(14px);
    opacity:0;
  }
  .card.show{display:block;animation:reveal .65s ease forwards}
  @keyframes reveal{to{opacity:1;transform:translateY(0)}}
  .date{font-size:.9rem;opacity:.55;margin-bottom:24px}
  .message{font-size:clamp(1.05rem,2.4vw,1.35rem);line-height:1.8;white-space:pre-line}
  .note-photo{
    width:100%;
    display:block;
    border-radius:16px;
    border:1px solid var(--border);
    box-shadow:0 12px 30px rgba(105,73,88,.10);
    background:#fff;
  }
  .sign{margin-top:26px;text-align:right;font-style:italic;font-size:1.05rem}
</style>
</head>
